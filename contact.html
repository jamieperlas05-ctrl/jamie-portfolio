</head>
<body data-page="contact">
  <header class="site-header">
    <div class="header-inner">
      <div class="header-left">
        <a class="social-link" href="https://www.instagram.com/jperlas.design/" aria-label="Instagram"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="17.5" cy="6.5" r="1.2"/></svg></a>
        <a class="social-link" href="https://www.linkedin.com/in/jamie-perlas/" aria-label="LinkedIn"><svg viewBox="0 0 24 24"><path d="M3 3h18v18H3zM7 10v7h2.2v-7zm1.1-3.4a1.3 1.3 0 1 0 0 2.6 1.3 1.3 0 0 0 0-2.6zM11 10v7h2.2v-3.6c0-1 .4-1.7 1.4-1.7s1.3.7 1.3 1.7V17H18v-4.1c0-2.2-1.2-3.2-2.8-3.2-1.3 0-1.9.7-2.2 1.2V10z"/></svg></a>
      </div>
      <nav class="header-center" aria-label="Main">
        <a class="nav-link" href="works.html">All works</a>
        <a class="logo" href="index.html">JP</a>
        <a class="nav-link" href="about.html">About me</a>

      <div class="header-right">
        <a class="nav-link" href="contact.html" aria-current="page">Contact</a>

    </div>
    <nav class="mobile-menu" id="mobile-menu" aria-label="Mobile">

      <a class="nav-link" href="contact.html">Contact</a>
    </nav>
  </header>

  <main class="panel">
    <h1 class="page-title">Contact Me</h1>
    <form class="contact-form" id="contact-form" novalidate>
      <div class="field">
        <label for="name">Name</label>
        <input id="name" name="name" type="text" autocomplete="name" required>
        <p class="error" data-error-for="name"></p>
      </div>
      <div class="field">
        <label for="subject">Subject</label>
        <input id="subject" name="subject" type="text" required>
        <p class="error" data-error-for="subject"></p>
      </div>
      <div class="field">
        <label for="message">Message</label>
        <textarea id="message" name="message" required></textarea>
        <p class="error" data-error-for="message"></p>
      </div>
      <button class="submit-button" type="submit">Send</button>
      <p class="form-status" id="form-status" role="status" aria-live="polite"></p>
    </form>
  </main>

  <footer class="site-footer">
    <div class="footer-name">Jamie Perlas</div>
    <div>
      <div class="footer-social">
        <a class="social-link" href="https://www.instagram.com/jperlas.design/" aria-label="Instagram"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="17.5" cy="6.5" r="1.2"/></svg></a>
        <a class="social-link" href="https://www.linkedin.com/in/jamie-perlas/" aria-label="LinkedIn"><svg viewBox="0 0 24 24"><path d="M3 3h18v18H3zM7 10v7h2.2v-7zm1.1-3.4a1.3 1.3 0 1 0 0 2.6 1.3 1.3 0 0 0 0-2.6zM11 10v7h2.2v-3.6c0-1 .4-1.7 1.4-1.7s1.3.7 1.3 1.7V17H18v-4.1c0-2.2-1.2-3.2-2.8-3.2-1.3 0-1.9.7-2.2 1.2V10z"/></svg></a>
      </div>
    </div>
  </footer>

  <script src="data/projects.js"></script>
  <script src="script.js"></script>

</html>
